<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Avegenie demo scene</title>
<!-- Source for assets/demo.mp4. Open in a browser to preview (it loops).
     Rendered to video frame by frame: window.renderAt(seconds), window.DURATION. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: #1e100a; overflow: hidden; }
  svg { display: block; width: 100vw; height: 100vh; }
  text { font-family: "Space Grotesk", system-ui, sans-serif; }
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
(() => {
  const NS = "http://www.w3.org/2000/svg";
  const stage = document.getElementById("stage");
  const el = (tag, attrs = {}, parent) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  };
  const txt = (parent, s, attrs) => { const t = el("text", attrs, parent); t.textContent = s; return t; };
  const set = (n, attrs) => { for (const k in attrs) n.setAttribute(k, attrs[k]); };

  // ── timing helpers ─────────────────────────────────────
  const cl = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const p = (t, a, b) => cl((t - a) / (b - a));
  const lerp = (a, b, x) => a + (b - a) * x;
  const eio = (x) => (x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2);
  const eout = (x) => 1 - Math.pow(1 - x, 3);
  const back = (x) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
  const win = (t, a, b, f = 0.3) => Math.min(p(t, a, a + f), 1 - p(t, b - f, b)); // fade in at a, out at b

  const INK = "#eef2fa", MUTED = "#8692b0", AMBER = "#ffb547", TEAL = "#5eead4", BG = "#1e100a";
  const DURATION = 26.5;

  // ── background ─────────────────────────────────────────
  const defs = el("defs", {}, stage);
  const g1 = el("radialGradient", { id: "glowA", cx: "80%", cy: "10%", r: "60%" }, defs);
  el("stop", { offset: "0%", "stop-color": "#3a2214", "stop-opacity": 0.55 }, g1);
  el("stop", { offset: "100%", "stop-color": "#3a2214", "stop-opacity": 0 }, g1);
  const g2 = el("radialGradient", { id: "glowB", cx: "0%", cy: "100%", r: "55%" }, defs);
  el("stop", { offset: "0%", "stop-color": AMBER, "stop-opacity": 0.08 }, g2);
  el("stop", { offset: "100%", "stop-color": AMBER, "stop-opacity": 0 }, g2);
  const scan = el("linearGradient", { id: "scanGrad", x1: 0, x2: 1, y1: 0, y2: 0 }, defs);
  el("stop", { offset: "0%", "stop-color": TEAL, "stop-opacity": 0 }, scan);
  el("stop", { offset: "85%", "stop-color": TEAL, "stop-opacity": 0.25 }, scan);
  el("stop", { offset: "100%", "stop-color": TEAL, "stop-opacity": 0.9 }, scan);
  el("rect", { width: 1920, height: 1080, fill: BG }, stage);
  el("rect", { width: 1920, height: 1080, fill: "url(#glowA)" }, stage);
  el("rect", { width: 1920, height: 1080, fill: "url(#glowB)" }, stage);

  // ── flat front-view sofa (thought bubble, fly-in, bottom sheet) ──
  function flatSofa(g) {
    el("rect", { x: -88, y: -52, width: 176, height: 62, rx: 18, fill: "#c96a50" }, g);
    el("rect", { x: -80, y: -44, width: 78, height: 48, rx: 14, fill: "#e07a5f" }, g);
    el("rect", { x: 2, y: -44, width: 78, height: 48, rx: 14, fill: "#e07a5f" }, g);
    el("rect", { x: -92, y: 0, width: 184, height: 32, rx: 12, fill: "#f0957a" }, g);
    el("rect", { x: -112, y: -22, width: 36, height: 66, rx: 16, fill: "#b95a42" }, g);
    el("rect", { x: 76, y: -22, width: 36, height: 66, rx: 16, fill: "#b95a42" }, g);
    el("rect", { x: -100, y: 30, width: 200, height: 16, rx: 6, fill: "#a14d38" }, g);
    el("rect", { x: -86, y: 46, width: 10, height: 14, rx: 3, fill: "#6b3a2a" }, g);
    el("rect", { x: 76, y: 46, width: 10, height: 14, rx: 3, fill: "#6b3a2a" }, g);
    return g;
  }

  // ── captions (top left) ────────────────────────────────
  const CAPS = [
    { a: 0.4, b: 5.0, n: "01", s: "Saw a sofa you love?", sub: "Will it fit in your room?", subAt: 2.6 },
    { a: 5.0, b: 8.6, n: "02", s: "Open Avegenie." },
    { a: 8.6, b: 13.5, n: "03", s: "Scan your room." },
    { a: 13.5, b: 19.3, n: "04", s: "Drop it in. Move it around." },
    { a: 19.3, b: 23.4, n: "05", s: "Love it? Buy it." },
  ];
  const capG = el("g", { transform: "translate(120 180)" }, stage);
  CAPS.forEach((c) => {
    c.g = el("g", {}, capG);
    txt(c.g, c.n, { x: 0, y: 0, fill: AMBER, "font-size": 30, "font-weight": 600, "letter-spacing": "4" });
    txt(c.g, c.s, { x: 0, y: 78, fill: INK, "font-size": 72, "font-weight": 700, "letter-spacing": "-2" });
    if (c.sub) c.subEl = txt(c.g, c.sub, { x: 0, y: 140, fill: MUTED, "font-size": 44, "font-weight": 500 });
  });

  // ── person ─────────────────────────────────────────────
  const SKIN = "#e7b48a";
  const person = el("g", {}, stage);
  el("ellipse", { cx: 0, cy: 340, rx: 150, ry: 22, fill: "#000", opacity: 0.3 }, person);
  el("rect", { x: -70, y: 190, width: 56, height: 150, rx: 24, fill: "#4a3426" }, person);
  el("rect", { x: 14, y: 190, width: 56, height: 150, rx: 24, fill: "#4a3426" }, person);
  el("ellipse", { cx: -44, cy: 338, rx: 44, ry: 16, fill: "#2a1a12" }, person);
  el("ellipse", { cx: 44, cy: 338, rx: 44, ry: 16, fill: "#2a1a12" }, person);
  const armL = el("g", {}, person);
  el("rect", { x: -128, y: 20, width: 50, height: 170, rx: 25, fill: "#e9a23c" }, armL);
  el("circle", { cx: -103, cy: 196, r: 26, fill: SKIN }, armL);
  const armR = el("g", {}, person);
  el("rect", { x: 78, y: 20, width: 50, height: 170, rx: 25, fill: "#e9a23c" }, armR);
  el("circle", { cx: 103, cy: 196, r: 26, fill: SKIN }, armR);
  el("rect", { x: -105, y: 0, width: 210, height: 220, rx: 70, fill: AMBER }, person);
  el("path", { d: "M-60 0 Q0 40 60 0", fill: "none", stroke: "#e0962e", "stroke-width": 6, "stroke-linecap": "round" }, person);
  el("rect", { x: -24, y: -22, width: 48, height: 34, rx: 10, fill: SKIN }, person);
  const head = el("g", {}, person);
  el("circle", { cx: -80, cy: -85, r: 16, fill: SKIN }, head);
  el("circle", { cx: 80, cy: -85, r: 16, fill: SKIN }, head);
  el("circle", { cx: 0, cy: -90, r: 82, fill: SKIN }, head);
  el("path", { d: "M-86 -96 Q-84 -186 0 -184 Q86 -186 88 -94 Q62 -142 0 -138 Q-54 -140 -86 -96 Z", fill: "#3a2116" }, head);
  const blush = el("g", { opacity: 0 }, head);
  el("ellipse", { cx: -48, cy: -58, rx: 14, ry: 8, fill: "#f08a6a", opacity: 0.6 }, blush);
  el("ellipse", { cx: 48, cy: -58, rx: 14, ry: 8, fill: "#f08a6a", opacity: 0.6 }, blush);
  el("path", { d: "M-44 -122 Q-30 -130 -16 -122", fill: "none", stroke: "#3a2116", "stroke-width": 6, "stroke-linecap": "round" }, head);
  el("path", { d: "M16 -122 Q30 -130 44 -122", fill: "none", stroke: "#3a2116", "stroke-width": 6, "stroke-linecap": "round" }, head);
  const eyes = el("g", {}, head);
  const eyeL = el("ellipse", { cx: -30, cy: -96, rx: 9, ry: 11, fill: "#1e100a" }, eyes);
  const eyeR = el("ellipse", { cx: 30, cy: -96, rx: 9, ry: 11, fill: "#1e100a" }, eyes);
  const mouthLine = el("path", { fill: "none", stroke: "#7a2e1e", "stroke-width": 6, "stroke-linecap": "round" }, head);
  const mouthOpen = el("path", { d: "M-30 -48 Q0 -6 30 -48 Z", fill: "#7a2e1e", opacity: 0 }, head);
  const heart = el("path", { d: "M0 12 C-30 -10 -22 -36 0 -22 C22 -36 30 -10 0 12 Z", fill: "#ff6b6b", opacity: 0 }, person);
  const sparkles = [[-150, -170], [150, -200], [-120, -260], [180, -110], [0, -300]].map(([x, y], i) => {
    const s = el("path", { d: "M0 -22 L6 -6 L22 0 L6 6 L0 22 L-6 6 L-22 0 L-6 -6 Z", fill: AMBER, opacity: 0 }, person);
    return { s, x, y, i };
  });

  // ── thought bubble ─────────────────────────────────────
  const trail = [[445, 540, 9], [500, 522, 14], [575, 505, 20]].map(([cx, cy, r]) => el("circle", { cx, cy, r, fill: "#fff4e6", opacity: 0 }, stage));
  const bubble = el("g", {}, stage);
  el("rect", { x: -270, y: -170, width: 540, height: 340, rx: 120, fill: "#fff4e6" }, bubble);
  const bubbleSofa = flatSofa(el("g", { transform: "translate(0 -55)" }, bubble));
  txt(bubble, "3-seat sofa", { x: 0, y: 72, fill: "#2a1a12", "font-size": 36, "font-weight": 700, "text-anchor": "middle" });
  el("rect", { x: -82, y: 94, width: 164, height: 40, rx: 20, fill: AMBER }, bubble);
  txt(bubble, "Embawood", { x: 0, y: 121, fill: "#2a1a12", "font-size": 22, "font-weight": 600, "text-anchor": "middle" });
  const bubbleQ = txt(bubble, "?", { x: 210, y: -90, fill: AMBER, "font-size": 80, "font-weight": 700, "text-anchor": "middle" });

  // ── phone ──────────────────────────────────────────────
  const phone = el("g", {}, stage);
  el("rect", { x: -530, y: -300, width: 1060, height: 600, rx: 60, fill: "#0b0604", stroke: "#4a3426", "stroke-width": 3 }, phone);
  el("circle", { cx: -506, cy: 0, r: 8, fill: "#2a1a12" }, phone);
  const clip = el("clipPath", { id: "screenClip" }, defs);
  el("rect", { x: -500, y: -270, width: 1000, height: 540, rx: 32 }, clip);
  const screen = el("g", { "clip-path": "url(#screenClip)" }, phone);
  el("rect", { x: -500, y: -270, width: 1000, height: 540, fill: "#140b07" }, screen);

  // isometric room, screen-local coordinates (screen centre = 0,0)
  const U = 40, C = U * 0.866, S = U * 0.5, HZ = U * 0.82, OX = -C, OY = -(18 * S - 5 * HZ) / 2 - 4;
  const P = (x, y, z = 0) => [(x - y) * C + OX, (x + y) * S - z * HZ + OY];
  const poly = (pts) => pts.map((q) => P(...q).map((v) => v.toFixed(1)).join(",")).join(" ");
  function box(g, x, y, z, w, d, h, col) {
    const st = { stroke: col.stroke, "stroke-width": 1.5, "stroke-linejoin": "round" };
    el("polygon", { ...st, fill: col.fy, points: poly([[x, y + d, z], [x + w, y + d, z], [x + w, y + d, z + h], [x, y + d, z + h]]) }, g);
    el("polygon", { ...st, fill: col.fx, points: poly([[x + w, y, z], [x + w, y + d, z], [x + w, y + d, z + h], [x + w, y, z + h]]) }, g);
    el("polygon", { ...st, fill: col.top, points: poly([[x, y, z + h], [x + w, y, z + h], [x + w, y + d, z + h], [x, y + d, z + h]]) }, g);
  }
  const PAL = {
    camera: { wall: "#3b322c", wallStroke: "#4d4038", floor: "#2e2621", grid: "#ffffff0a", window: "#5a5048", winStroke: "#6a5e55",
              f: { top: "#9a8f85", fx: "#776d64", fy: "#5d554e", stroke: "#1a1410" }, leaf: "#6f7a5e" },
    model:  { wall: "#5eead414", wallStroke: TEAL, floor: "#5eead40d", grid: "#5eead41f", window: "#5eead422", winStroke: "#5eead499",
              f: { top: "#ffd38a", fx: "#f0a73e", fy: "#c98422", stroke: "#5a3a08" }, leaf: "#ffd38a" },
  };
  function buildRoom(g, pal) {
    el("polygon", { fill: pal.wall, stroke: pal.wallStroke, "stroke-width": 2, points: poly([[0, 0, 0], [10, 0, 0], [10, 0, 5], [0, 0, 5]]) }, g);
    el("polygon", { fill: pal.wall, stroke: pal.wallStroke, "stroke-width": 2, points: poly([[0, 0, 0], [0, 8, 0], [0, 8, 5], [0, 0, 5]]) }, g);
    el("polygon", { fill: pal.floor, stroke: pal.wallStroke, "stroke-width": 2, points: poly([[0, 0, 0], [10, 0, 0], [10, 8, 0], [0, 8, 0]]) }, g);
    for (let i = 1; i < 10; i++) { const [a, b] = [P(i, 0), P(i, 8)]; el("line", { x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: pal.grid, "stroke-width": 1.5 }, g); }
    for (let j = 1; j < 8; j++) { const [a, b] = [P(0, j), P(10, j)]; el("line", { x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: pal.grid, "stroke-width": 1.5 }, g); }
    el("polygon", { fill: pal.window, stroke: pal.winStroke, "stroke-width": 2, points: poly([[6.2, 0, 2], [8.8, 0, 2], [8.8, 0, 4.1], [6.2, 0, 4.1]]) }, g);
    // existing furniture, back to front
    box(g, 0.25, 2.2, 0, 1.1, 1.8, 2.4, pal.f);                 // cabinet on the left wall
    box(g, 8.9, 0.5, 0, 0.7, 0.7, 0.7, pal.f);                  // plant pot
    [[9.25, 0.85, 1.5, 22], [9.05, 1.0, 1.15, 16], [9.45, 0.7, 1.2, 16]].forEach(([x, y, z, r]) => {
      const [cx, cy] = P(x, y, z); el("ellipse", { cx, cy, rx: r, ry: r * 0.8, fill: pal.leaf, stroke: pal.f.stroke, "stroke-width": 1.5 }, g);
    });
    box(g, 7.0, 3.4, 0, 1.8, 1.1, 0.55, pal.f);                 // coffee table
  }

  // splash
  const splash = el("g", {}, screen);
  el("rect", { x: -500, y: -270, width: 1000, height: 540, fill: BG }, splash);
  const splashLogo = el("g", {}, splash);
  el("image", { href: "../../assets/logo.svg", x: -80, y: -140, width: 160, height: 160 }, splashLogo);
  const splashName = txt(splash, "Avegenie", { x: 0, y: 90, fill: INK, "font-size": 64, "font-weight": 700, "text-anchor": "middle", "letter-spacing": "-1" });

  // camera view + model
  const cam = el("g", {}, screen);
  el("rect", { x: -500, y: -270, width: 1000, height: 540, fill: "#17100c" }, cam);
  const world = el("g", {}, cam);
  const camRoom = el("g", {}, world); buildRoom(camRoom, PAL.camera);
  const modelRoom = el("g", { opacity: 0 }, world); buildRoom(modelRoom, PAL.model);
  screen.appendChild(splash); // splash sits on top of the camera view until it fades

  // scan dots
  let seed = 7;
  const rnd = () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let q = Math.imul(seed ^ (seed >>> 15), 1 | seed); q = (q + Math.imul(q ^ (q >>> 7), 61 | q)) ^ q; return ((q ^ (q >>> 14)) >>> 0) / 4294967296; };
  const dotsG = el("g", {}, world);
  const surfaces = [
    { o: [0, 0, 0], a: [10, 0, 0], b: [0, 0, 5], n: 170 }, { o: [0, 0, 0], a: [0, 8, 0], b: [0, 0, 5], n: 130 },
    { o: [0, 0, 0], a: [10, 0, 0], b: [0, 8, 0], n: 240 }, { o: [0.25, 2.2, 2.4], a: [1.1, 0, 0], b: [0, 1.8, 0], n: 20 },
    { o: [1.35, 2.2, 0], a: [0, 1.8, 0], b: [0, 0, 2.4], n: 24 }, { o: [7.0, 3.4, 0.55], a: [1.8, 0, 0], b: [0, 1.1, 0], n: 20 },
    { o: [7.0, 4.5, 0], a: [1.8, 0, 0], b: [0, 0, 0.55], n: 12 }, { o: [8.9, 0.5, 0.7], a: [0.7, 0, 0], b: [0, 0.7, 0], n: 10 },
  ];
  const dots = [];
  surfaces.forEach((s) => { for (let k = 0; k < s.n; k++) {
    const u = rnd(), v = rnd(); const q = [0, 1, 2].map((ax) => s.o[ax] + u * s.a[ax] + v * s.b[ax]); const [cx, cy] = P(...q);
    dots.push({ n: el("circle", { cx: cx.toFixed(1), cy: cy.toFixed(1), r: (1.6 + rnd() * 1.8).toFixed(2), fill: "#c8fff5", opacity: 0 }, dotsG), x: cx });
  } });
  const scanLine = el("g", { opacity: 0 }, cam);
  el("rect", { x: -140, y: -270, width: 140, height: 540, fill: "url(#scanGrad)" }, scanLine);
  el("rect", { x: -3, y: -270, width: 4, height: 540, fill: TEAL }, scanLine);

  // the new sofa (room coords at origin, moved with a transform)
  const SOFA = { top: "#f4a890", fx: "#e07a5f", fy: "#b95a42", stroke: "#3a1408" };
  const sofaWrap = el("g", { opacity: 0 }, modelRoom);
  const sofaShadow = el("polygon", { fill: "#000", opacity: 0.35, points: poly([[-0.05, -0.05, 0], [3.05, -0.05, 0], [3.05, 1.25, 0], [-0.05, 1.25, 0]]) }, sofaWrap);
  const sofaLift = el("g", {}, sofaWrap);
  box(sofaLift, 0, 0, 0, 3.0, 1.2, 0.5, SOFA);
  box(sofaLift, 0, 0, 0.5, 3.0, 0.32, 0.85, SOFA);
  box(sofaLift, 0, 0.32, 0.5, 0.3, 0.88, 0.42, SOFA);
  box(sofaLift, 2.7, 0.32, 0.5, 0.3, 0.88, 0.42, SOFA);
  const landing = el("polygon", { fill: "none", stroke: AMBER, "stroke-width": 3, opacity: 0, points: poly([[-0.15, -0.15, 0], [3.15, -0.15, 0], [3.15, 1.35, 0], [-0.15, 1.35, 0]]) }, sofaWrap);
  const A = [5.4, 5.7], B = [3.2, 0.25];
  const isoShift = ([x, y]) => [(x - y) * C, (x + y) * S];

  const badge = el("g", { opacity: 0 }, screen);
  el("rect", { x: -78, y: -26, width: 156, height: 52, rx: 26, fill: TEAL }, badge);
  txt(badge, "✓ Fits", { x: 0, y: 10, fill: "#0b2a26", "font-size": 28, "font-weight": 700, "text-anchor": "middle" });

  // HUD
  const hud = el("g", { opacity: 0 }, screen);
  [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sy]) => {
    const x = sx * 462, y = sy * 232;
    el("path", { d: `M${x} ${y - sy * 40} V${y} H${x - sx * 40}`, fill: "none", stroke: AMBER, "stroke-width": 5, "stroke-linecap": "round" }, hud);
  });
  const bar = el("g", { opacity: 0 }, screen);
  el("rect", { x: -260, y: 214, width: 520, height: 10, rx: 5, fill: "#ffffff22" }, bar);
  const barFill = el("rect", { x: -260, y: 214, width: 0, height: 10, rx: 5, fill: TEAL }, bar);
  const pill = el("g", { opacity: 0 }, screen);
  el("rect", { x: -200, y: -250, width: 400, height: 54, rx: 27, fill: "#000000aa" }, pill);
  const LABELS = [
    { a: 7.4, b: 8.7, s: "Point at your room" },
    { a: 8.7, b: 12.4, s: "Scanning…", pct: true },
    { a: 12.4, b: 14.4, s: "✓ 3 pieces found" },
    { a: 14.6, b: 17.6, s: "Drag to move" },
  ].map((l) => ({ ...l, n: txt(pill, l.s, { x: 0, y: -213, fill: INK, "font-size": 26, "font-weight": 600, "text-anchor": "middle", opacity: 0 }) }));

  // bottom sheet with buy button
  const sheet = el("g", {}, screen);
  el("rect", { x: -480, y: 92, width: 960, height: 160, rx: 28, fill: "#fff7ec" }, sheet);
  el("rect", { x: -456, y: 112, width: 120, height: 120, rx: 18, fill: "#f6e7de" }, sheet);
  flatSofa(el("g", { transform: "translate(-396 176) scale(0.48)" }, sheet));
  txt(sheet, "3-seat sofa", { x: -312, y: 162, fill: "#2a1a12", "font-size": 36, "font-weight": 700 });
  txt(sheet, "Embawood · fits your room", { x: -312, y: 206, fill: "#8a6a55", "font-size": 26, "font-weight": 500 });
  const btn = el("g", {}, sheet);
  const btnBuy = el("g", {}, btn);
  el("rect", { x: -150, y: -40, width: 300, height: 80, rx: 40, fill: AMBER }, btnBuy);
  txt(btnBuy, "Buy now", { x: 0, y: 11, fill: "#2a1a12", "font-size": 32, "font-weight": 700, "text-anchor": "middle" });
  const btnDone = el("g", { opacity: 0 }, btn);
  el("rect", { x: -150, y: -40, width: 300, height: 80, rx: 40, fill: TEAL }, btnDone);
  txt(btnDone, "✓ Added to cart", { x: 0, y: 10, fill: "#0b2a26", "font-size": 28, "font-weight": 700, "text-anchor": "middle" });

  const touch = el("g", { opacity: 0 }, screen);
  el("circle", { r: 30, fill: "#ffffff55", stroke: "#fff", "stroke-width": 3 }, touch);
  const touchRing = el("circle", { r: 30, fill: "none", stroke: "#fff", "stroke-width": 2 }, touch);

  // fly-in thumbnail (global)
  const fly = el("g", { opacity: 0 }, stage);
  flatSofa(fly);

  // end card
  const endCard = el("g", { opacity: 0 }, stage);
  el("rect", { width: 1920, height: 1080, fill: BG }, endCard);
  el("rect", { width: 1920, height: 1080, fill: "url(#glowA)" }, endCard);
  const endLogo = el("g", {}, endCard);
  el("image", { href: "../../assets/logo.svg", x: -110, y: -110, width: 220, height: 220 }, endLogo);
  const endName = txt(endCard, "Avegenie", { x: 960, y: 640, fill: INK, "font-size": 140, "font-weight": 700, "text-anchor": "middle", "letter-spacing": "-4" });
  const endTag = txt(endCard, "Scan your room. Move anything.", { x: 960, y: 720, fill: MUTED, "font-size": 48, "font-weight": 500, "text-anchor": "middle" });

  // ── per-frame state ────────────────────────────────────
  const PHONE_X = 1240, PHONE_Y = 560;
  const BUBBLE_FULL = [1000, 470], BUBBLE_MINI = [545, 420];

  function renderAt(t) {
    // captions
    CAPS.forEach((c) => {
      const o = win(t, c.a, c.b, 0.35), y = (1 - eout(p(t, c.a, c.a + 0.5))) * 30;
      set(c.g, { opacity: o.toFixed(3), transform: `translate(0 ${y.toFixed(1)})` });
      if (c.subEl) set(c.subEl, { opacity: p(t, c.subAt, c.subAt + 0.4).toFixed(3) });
    });

    // person
    const bob = Math.sin(t * 2.2) * 3;
    const happyArms = back(p(t, 21.1, 21.6)) * (1 - p(t, 23.0, 23.4));
    set(person, { transform: `translate(330 ${(700 + bob + (1 - eout(p(t, 0, 0.8))) * 120).toFixed(1)})`, opacity: p(t, 0, 0.5).toFixed(3) });
    set(armL, { transform: `rotate(${(150 * happyArms).toFixed(1)} -103 30)` });
    set(armR, { transform: `rotate(${(-150 * happyArms).toFixed(1)} 103 30)` });
    const think = win(t, 0.8, 5.2, 0.4);
    set(head, { transform: `rotate(${(-7 * think).toFixed(2)} 0 -20)` });
    const look = think > 0 ? [8 * think, -8 * think] : [0, 0];
    const atPhone = p(t, 5.0, 5.5) * (1 - p(t, 19.4, 19.7));
    const lx = look[0] + 10 * atPhone, ly = look[1] + 3 * atPhone;
    const happy = p(t, 19.5, 19.9);
    set(eyes, { transform: `translate(${lx.toFixed(1)} ${ly.toFixed(1)})` });
    [eyeL, eyeR].forEach((e) => set(e, { ry: (11 - 7 * happy).toFixed(1) }));
    const smile = lerp(-0.1, 0.5, p(t, 15.0, 18.0));
    set(mouthLine, { d: `M${-22 - 8 * smile} -46 Q0 ${(-46 + 4 + 26 * smile).toFixed(1)} ${22 + 8 * smile} -46`, opacity: (1 - happy).toFixed(3) });
    set(mouthOpen, { opacity: happy.toFixed(3) });
    set(blush, { opacity: (happy * (1 - p(t, 23.0, 23.4))).toFixed(3) });
    const hp = p(t, 19.6, 21.0);
    set(heart, { opacity: (Math.min(p(t, 19.6, 19.8), 1 - p(t, 20.6, 21.0))).toFixed(3), transform: `translate(${(95 + 20 * hp).toFixed(1)} ${(-200 - 120 * eout(hp)).toFixed(1)}) scale(${(1.6 + 0.4 * hp).toFixed(2)})` });
    sparkles.forEach(({ s, x, y, i }) => {
      const k = p(t, 21.1 + i * 0.12, 21.5 + i * 0.12) * (1 - p(t, 22.9, 23.3));
      const pulse = 0.7 + 0.3 * Math.sin(t * 8 + i);
      set(s, { opacity: k.toFixed(3), transform: `translate(${x} ${y}) scale(${(k * pulse).toFixed(2)})` });
    });

    // thought bubble
    const bIn = back(p(t, 1.3, 1.8)), shrink = eio(p(t, 5.0, 5.8)), gone = p(t, 13.6, 13.9);
    const [bx, by] = [lerp(BUBBLE_FULL[0], BUBBLE_MINI[0], shrink), lerp(BUBBLE_FULL[1], BUBBLE_MINI[1], shrink) + Math.sin(t * 1.8) * 6];
    set(bubble, { transform: `translate(${bx.toFixed(1)} ${by.toFixed(1)}) scale(${(bIn * lerp(1, 0.42, shrink)).toFixed(3)})`, opacity: (p(t, 1.3, 1.5) * (1 - gone)).toFixed(3) });
    set(bubbleQ, { opacity: p(t, 2.6, 3.0).toFixed(3) });
    trail.forEach((c, i) => set(c, { opacity: (p(t, 0.8 + i * 0.15, 1.0 + i * 0.15) * (1 - p(t, 5.0, 5.4))).toFixed(3) }));
    set(bubbleSofa, { opacity: (1 - p(t, 13.6, 13.65)).toFixed(3) });

    // phone
    const up = eout(p(t, 5.0, 5.9)), down = eio(p(t, 23.0, 23.5));
    set(phone, { transform: `translate(${PHONE_X} ${(PHONE_Y + (1 - up) * 900 + down * 900).toFixed(1)})` });
    set(splash, { opacity: (1 - p(t, 7.2, 7.6)).toFixed(3) });
    set(splashLogo, { transform: `translate(0 0) scale(${back(p(t, 5.9, 6.4)).toFixed(3)})`, opacity: p(t, 5.9, 6.1).toFixed(3) });
    set(splashName, { opacity: p(t, 6.3, 6.7).toFixed(3) });

    // camera wobble while scanning
    const wob = p(t, 7.4, 8.0) * (1 - p(t, 12.0, 12.6));
    set(world, { transform: `translate(${(16 * Math.sin(t * 1.9) * wob).toFixed(1)} ${(6 * Math.sin(t * 2.7) * wob).toFixed(1)})` });
    const toModel = p(t, 12.3, 13.0);
    set(camRoom, { opacity: (1 - toModel).toFixed(3) });
    set(modelRoom, { opacity: toModel.toFixed(3) });

    // scan line + dots
    const sweep = p(t, 8.7, 12.2), lineX = lerp(-560, 560, sweep);
    set(scanLine, { opacity: win(t, 8.7, 12.4, 0.2).toFixed(3), transform: `translate(${lineX.toFixed(1)} 0)` });
    const dotsFade = 1 - p(t, 12.5, 13.3);
    dots.forEach((d) => set(d.n, { opacity: (cl((lineX - d.x - OX) / 40) * dotsFade * (t >= 8.7 ? 1 : 0)).toFixed(2) }));

    // HUD
    set(hud, { opacity: (p(t, 7.4, 7.8) * (1 - p(t, 12.4, 12.9))).toFixed(3) });
    set(bar, { opacity: win(t, 8.6, 12.8, 0.25).toFixed(3) });
    set(barFill, { width: (520 * sweep).toFixed(1) });
    set(pill, { opacity: win(t, 7.4, 17.6, 0.3).toFixed(3) });
    LABELS.forEach((l) => {
      set(l.n, { opacity: win(t, l.a, l.b, 0.2).toFixed(3) });
      if (l.pct) l.n.textContent = `Scanning… ${Math.round(sweep * 100)}%`;
    });

    // sofa: drop at A, drag to B
    const drag = eio(p(t, 15.6, 17.3));
    const pos = [lerp(A[0], B[0], drag), lerp(A[1], B[1], drag)];
    const [sx, sy] = isoShift(pos);
    const drop = p(t, 14.55, 15.15), lift = Math.min(p(t, 15.35, 15.6), 1 - p(t, 17.3, 17.55));
    const dropY = drop < 1 ? -170 * (1 - back(drop)) : 0;
    set(sofaWrap, { opacity: p(t, 14.55, 14.65).toFixed(3), transform: `translate(${sx.toFixed(1)} ${sy.toFixed(1)})` });
    set(sofaLift, { transform: `translate(0 ${(dropY - 16 * lift).toFixed(1)})` });
    set(sofaShadow, { opacity: (0.35 * p(t, 14.8, 15.1)).toFixed(3) });
    set(landing, { opacity: Math.min(p(t, 14.9, 15.1), 1 - p(t, 15.3, 15.9)).toFixed(3) });
    const [tcx, tcy] = P(pos[0] + 1.5, pos[1] + 0.6, 0.9);
    const touchSofa = win(t, 15.2, 17.6, 0.2);
    const touchBuy = win(t, 20.5, 21.4, 0.2);
    const press = Math.max(1 - Math.abs(t - 15.45) / 0.15, 1 - Math.abs(t - 20.9) / 0.15, 0);
    const [tx, ty] = touchBuy > 0 ? [300, 175] : [tcx, tcy - 16 * lift];
    set(touch, { opacity: Math.max(touchSofa, touchBuy).toFixed(3), transform: `translate(${tx.toFixed(1)} ${ty.toFixed(1)}) scale(${(1 - 0.25 * cl(press)).toFixed(3)})` });
    set(touchRing, { r: (30 + 40 * cl(press)).toFixed(1), opacity: (1 - cl(press)).toFixed(2) });
    const [bx2, by2] = P(B[0] + 1.5, B[1] + 0.6, 3.0);
    set(badge, { opacity: (p(t, 17.6, 17.8) * (1 - p(t, 19.2, 19.4))).toFixed(3), transform: `translate(${bx2.toFixed(1)} ${by2.toFixed(1)}) scale(${back(p(t, 17.6, 18.0)).toFixed(3)})` });

    // fly-in from the thought bubble into the phone
    const f = p(t, 13.6, 14.6), fe = eio(f);
    const [ax, ay] = P(A[0] + 1.5, A[1] + 0.6, 0.6);
    const from = [BUBBLE_MINI[0], BUBBLE_MINI[1] - 23], to = [PHONE_X + ax, PHONE_Y + ay];
    const fx = lerp(from[0], to[0], fe), fy = lerp(from[1], to[1], fe) - Math.sin(Math.PI * fe) * 180;
    set(fly, { opacity: (f > 0 && f < 1 ? 1 : 0) * (1 - p(t, 14.45, 14.6)), transform: `translate(${fx.toFixed(1)} ${fy.toFixed(1)}) scale(${lerp(0.42, 0.7, Math.sin(Math.PI * fe)).toFixed(3)})` });

    // buy sheet
    const sh = eout(p(t, 19.3, 19.8));
    set(sheet, { transform: `translate(0 ${((1 - sh) * 220).toFixed(1)})` });
    set(btn, { transform: `translate(300 172) scale(${(1 - 0.05 * cl(1 - Math.abs(t - 20.9) / 0.15)).toFixed(3)})` });
    const done = p(t, 21.0, 21.2);
    set(btnBuy, { opacity: (1 - done).toFixed(3) });
    set(btnDone, { opacity: done.toFixed(3) });

    // end card, then fade back to the empty background for a clean loop
    const ec = p(t, 23.4, 24.0) * (1 - p(t, 26.0, 26.5));
    set(endCard, { opacity: ec.toFixed(3) });
    set(endLogo, { transform: `translate(960 ${(420).toFixed(1)}) scale(${back(p(t, 23.8, 24.3)).toFixed(3)})`, opacity: p(t, 23.8, 23.95).toFixed(3) });
    set(endName, { opacity: p(t, 24.1, 24.5).toFixed(3), transform: `translate(0 ${((1 - eout(p(t, 24.1, 24.6))) * 30).toFixed(1)})` });
    set(endTag, { opacity: p(t, 24.5, 24.9).toFixed(3) });
  }

  window.DURATION = DURATION;
  window.renderAt = renderAt;
  renderAt(0);
  if (!/[?&]render/.test(location.search)) {
    const t0 = performance.now();
    const loop = (now) => { renderAt(((now - t0) / 1000) % DURATION); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
